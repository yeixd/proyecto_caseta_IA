services:
  db:
    image: postgres:16-alpine
    container_name: peaje_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peaje_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-peaje_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peaje_user} -d ${POSTGRES_DB:-peaje_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: peaje_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peaje_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-peaje_db}
      EVIDENCE_DIR: /app/uploads/evidencias
    volumes:
      - evidencias_data:/app/uploads/evidencias
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://peaje.tudominio.com}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://peaje.tudominio.com}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: peaje_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  evidencias_data:
